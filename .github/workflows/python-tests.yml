name: Run Tests

on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.review.outputs.result }}
    steps:
      - name: Verify maintainer approval
        id: review
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            if (context.eventName === 'workflow_dispatch') return context.sha;
            const { review, pull_request: pr } = context.payload;
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: review.user.login,
            });
            if (!['write', 'admin'].includes(access.permission)) return '';
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            if (current.state !== 'open' || review.commit_id !== current.head.sha) return '';
            return review.commit_id;

  test:
    needs: authorize
    if: needs.authorize.outputs.ref != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Static checks
        run: |
          .venv/bin/ruff check .
          .venv/bin/black --check .
          .venv/bin/mypy
          .venv/bin/pylint src/padrelay
          .venv/bin/pyright

      - name: Run tests with coverage
        run: |
          .venv/bin/pytest --cov=padrelay --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
