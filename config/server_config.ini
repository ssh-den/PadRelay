[server]
# This default accepts local clients only. Set a LAN address for remote clients.
host = 127.0.0.1
port = 9999
# Reset stale input even if heartbeat stays alive.
input_timeout = 1.0
protocol = tcp
password = your_secure_password
rate_limit_window = 60
# Change to 6000 for the default 60 Hz UDP setup; UDP needs TCP and UDP allowed.
max_requests = 100
block_duration = 2

[vgamepad]
type = xbox360
