[network]
server_ip = 192.168.1.100
server_port = 9999
protocol = tcp
password = your_secure_password

[joystick]
index = 0

[client]
update_rate = 60

[security]
# Copy the server's public certificate through a trusted channel, then set:
# ca_path = /path/to/trusted-server.crt
# For the default certificate reached through a LAN IP:
# server_hostname = localhost
# UDP v2 also requires these trust settings and a TLS control connection.
